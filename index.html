<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GENERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#ffd4e8;      /* pastel pink */
    --bg2:#ffb3d6;      /* brighter pink */
    --fg:#7a1b4f;       /* berry text */
    --panel:#fff0f7;    /* light panel */
    --panel-2:#ffe3f1;  /* secondary panel */
    --accent:#ff6fb1;   /* hot pink */
    --accent-2:#ff3e98; /* deeper pink */
    --muted:#e7a6c7;    /* border */
    --shadow: 0 10px 30px rgba(255, 62, 152, .25);
  }
  *{box-sizing:border-box}
  body {
    margin: 0;
    font-family: 'Poppins', 'Montserrat', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1000px 600px at 15% 10%, var(--bg1), transparent 60%),
                radial-gradient(900px 500px at 85% 20%, #ffe6f3, transparent 60%),
                linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.2rem;
  }
  #contenedor-principal {
    background: linear-gradient(180deg, var(--panel) 0%, #ffffff 100%);
    border-radius: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: row;
    width: 980px;
    max-width: 100%;
    overflow: hidden;
    border: 1.5px solid var(--muted);
  }
  #formulario-container, #salida-container {
    padding: 1.6rem 2rem;
    width: 50%;
  }
  #formulario-container {
    background: var(--panel-2);
    border-right: 2px dashed var(--muted);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  #formulario-container h2 {
    font-weight: 700;
    margin: .25rem 0 0.75rem;
    color: var(--accent-2);
    text-align: center;
    letter-spacing: 1px;
  }
  .pill {
    display:inline-block; padding:.35rem .75rem; border-radius:999px; background:#fff; border:1px solid var(--muted); font-size:.8rem; font-weight:600; color:var(--accent-2);
  }
  input[type="text"] {
    border-radius: 14px;
    border: 2px solid var(--muted);
    padding: 0.8rem 1rem;
    font-size: 1rem;
    transition: all 0.25s ease;
    outline-offset: 2px;
    width: 100%;
    background:#fff;
  }
  input[type="text"]::placeholder{color:#af6c8f}
  input[type="text"]:focus {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 4px rgba(255, 62, 152, .12);
  }
  #guia {
    background: #fff;
    border: 2px solid var(--muted);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    user-select: none;
  }
  #guia code{font-weight:700;color:var(--accent-2)}
  #salida-container {
    background: linear-gradient(180deg, #ffffffcc 0%, #fff 100%);
    display: flex;
    flex-direction: column;
  }
  #salida {
    white-space: pre-wrap;
    font-size: 1rem;
    font-family: 'Courier New', Courier, monospace;
    padding: 1rem;
    background: #fff;
    border: 2px solid var(--muted);
    border-radius: 16px;
    min-height: 260px;
    box-shadow: inset 0 0 0 6px #ffe6f3;
    color: var(--fg);
    overflow-y: auto;
    line-height: 1.35;
  }
  #selecciona {  
    margin-top: 1rem;
    text-align: center;
    font-weight: 700;
    color: var(--accent-2);
    user-select: none;
    font-size: 1rem;
  }
  #perfilBtns {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0.5rem 0 1rem;
  }
  #perfilBtns button {
    background-color: #ffd1e7;
    border: 1px solid var(--muted);
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--fg);
    box-shadow: 0 3px 10px rgba(255, 111, 177, 0.3);
    transition: transform .15s ease, background-color 0.25s ease, box-shadow .25s ease;
    user-select: none;
  }
  #perfilBtns button.active {
    background-color: var(--accent);
    color: white;
    cursor: default;
    box-shadow: 0 6px 16px rgba(255, 62, 152, 0.45);
    transform: translateY(-1px);
  }
  #perfilBtns button:hover:not(.active):not([disabled]) {
    background-color: #ffc2df;
    transform: translateY(-1px);
  }
  #perfilBtns button[disabled]{opacity:.5; cursor:not-allowed; filter:grayscale(.3)}

  #copiarBtn {
    align-self: center;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    color: white;
    font-weight: 800;
    border: none;
    padding: 0.8rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 1rem;
    box-shadow: 0 10px 22px rgba(255, 62, 152, 0.45);
    transition: transform .1s ease;
    margin: .3rem 0 1rem;
  }
  #copiarBtn:active{transform:scale(.98)}

  /* 📱 Responsivo */
  @media (max-width: 860px) {
    #contenedor-principal { flex-direction: column; width: 100%; border-radius: 18px; }
    #formulario-container, #salida-container { width: 100%; border-right: none; border-radius: 0; padding: 1.1rem 1rem; }
    #salida-container { border-top: 2px dashed var(--muted); }
    #salida { min-height: 200px; }
  }
</style>
</head>
<body>
  <div id="contenedor-principal">
    <div id="formulario-container">
      <h2>GENERADOR</h2>
      <div id="guia" aria-live="polite">
        <strong>Guía de uso:</strong>
        <ul>
          <li><code>n</code>: Netflix</li>
          <li><code>m</code>: Max</li>
          <li><code>p</code>: Prime Video</li>
          <li><code>pr</code>: Paramount+</li>
          <li><code>v</code>: Vix</li>
          <li><code>c</code>: Crunchyroll</li>
          <li><code>d</code>: Disney+</li>
          <li><code>s</code>: Spotify</li>
        </ul>
        <p>En "Tipo", escribe <code>c</code> para <strong>COMPLETA</strong>. Si no, selecciona un perfil abajo.</p>
      </div>

      <input type="text" id="plataforma" placeholder="Plataforma (n, m, p, pr, v, c, d, s)" autocomplete="off" />
      <input type="text" id="correo" placeholder="Correo" autocomplete="off" />
      <input type="text" id="contrasena" placeholder="Contraseña" autocomplete="off" />
      <input type="text" id="tipo" placeholder="Tipo (escribe 'c' para COMPLETA)" autocomplete="off" />
    </div>

    <div id="salida-container">
      <div id="salida" aria-live="polite" role="region" aria-label="Resultado"></div>
      <p id="selecciona">Selecciona el perfil</p>
      <div id="perfilBtns" role="group" aria-label="Botones de perfiles"></div>
      <button id="copiarBtn" aria-label="Copiar texto generado">📋 Copiar todo</button>
    </div>
  </div>

<script>
  const plataformaInput = document.getElementById('plataforma');
  const correoInput = document.getElementById('correo');
  const contrasenaInput = document.getElementById('contrasena');
  const tipoInput = document.getElementById('tipo');
  const salida = document.getElementById('salida');
  const perfilBtns = document.getElementById('perfilBtns');
  const copiarBtn = document.getElementById('copiarBtn');
  const selecciona = document.getElementById('selecciona');

  let perfilSeleccionado = 'P1';

  const plataformas = {
    n: '𝓝𝓔𝓣𝓕𝓛𝓘𝓧',
    m: '𝓜𝓐𝓧 / 𝓗𝓑𝓞',
    p: '𝓟𝓡𝓘𝓜𝓔',
    pr: '𝓟𝓐𝓡𝓐𝓜𝓞𝓤𝓝𝓣',
    v: '𝓥𝓘𝓧',
    c: '𝓒𝓡𝓤𝓝𝓒𝓗𝓨𝓡𝓞𝓛𝓛',
    d: '𝓓𝓘𝓢𝓝𝓔𝓨',
    s: '𝓢𝓟𝓞𝓣𝓘𝓕𝓨'
  };

  function setPerfilesVisible(enabled){
    if(enabled){
      selecciona.style.display = '';
      perfilBtns.style.display = 'flex';
      [...perfilBtns.querySelectorAll('button')].forEach(b=> b.disabled=false);
    } else {
      selecciona.style.display = 'none';
      perfilBtns.style.display = 'none';
      [...perfilBtns.querySelectorAll('button')].forEach(b=> b.disabled=true);
    }
  }

  function crearBotonesPerfil(max) {
    perfilBtns.innerHTML = '';
    if(max === 0){ return; }
    for(let i=1; i<=max; i++){
      const btn = document.createElement('button');
      btn.textContent = `𝙋${i}`;
      btn.dataset.perfil = `P${i}`;
      if(i === 1) btn.classList.add('active');
      btn.addEventListener('click', () => {
        if(tipoInput.value.trim().toLowerCase() === 'c') return; // si es completa, no cambiar perfil
        document.querySelectorAll('#perfilBtns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        perfilSeleccionado = btn.dataset.perfil;
        actualizarSalida();
      });
      perfilBtns.appendChild(btn);
    }
  }

  function definirCantidadPerfiles(){
    const cod = plataformaInput.value.trim().toLowerCase();
    if(cod === 's'){
      // Spotify: sin perfiles visibles ni clickeables y mostrar salida inmediata
      crearBotonesPerfil(0);
      setPerfilesVisible(false);
      actualizarSalida();
      return;
    }
    setPerfilesVisible(true);
    if(cod === 'd') crearBotonesPerfil(7);
    else if(cod === 'p' || cod === 'pr') crearBotonesPerfil(6);
    else crearBotonesPerfil(5);
  }
    setPerfilesVisible(true);
    if(cod === 'd') crearBotonesPerfil(7);
    else if(cod === 'p' || cod === 'pr') crearBotonesPerfil(6);
    else crearBotonesPerfil(5);
  }

  function interpretarPlataforma(cod){
    return plataformas[cod] || '';
  }

  function obtenerFechaFormateada(){
    const fecha = new Date();
    const opciones = { day: '2-digit', month: 'short', year: 'numeric' };
    return fecha.toLocaleDateString('es-ES', opciones).replace('.', '');
  }

  function reglasDispositivos(tipo){
    // Si es cuenta COMPLETA: mostrar que el máximo de dispositivos va por su cuenta.
    if(tipo === 'c') return '🌙 EL MÁXIMO DE DISPOSITIVOS VA POR SU CUENTA';
    // Si es perfil: mantener regla de 1 dispositivo.
    return '🌙 UN SOLO DISPOSITIVO';
  }

  function salidaSoloReportes(){
    const texto = 
`╔══════════🌙 𝓛𝓾𝓷𝓪𝓵𝓲 𝓢𝓽𝓻𝓮𝓪𝓶𝓲𝓷𝓰 🌙══════════╗
   🍒 𝓢𝓟𝓞𝓣𝓘𝓕𝓎 • ${obtenerFechaFormateada()} 🍓

⏳ *TIENEN 40 MINUTOS PARA REVISAR SUS CUENTAS, DESPUÉS ENTRA A REPORTE 🚨*
> 🍒 𝓖𝓻𝓾𝓹𝓸 𝓭𝓮 𝓡𝓮𝓹𝓸𝓻𝓽𝓮𝓼: https://forms.gle/Y7sHyL7Gouchfwuc8

💖 NO CAMBIAR DATOS.
╚══════════🍓 𝓖𝓻𝓪𝓬𝓲𝓪𝓼 𝓹𝓸𝓻 𝓽𝓾 𝓬𝓸𝓶𝓹𝓻𝓪 🍓══════════╝`;
    return texto;
  }

  function actualizarSalida(){
    const cod = plataformaInput.value.trim().toLowerCase();

    // Spotify: bloquear perfiles y mostrar SOLO el bloque de reportes SIEMPRE
    if(cod === 's'){
      salida.textContent = salidaSoloReportes();
      return;
    }

    const plataforma = interpretarPlataforma(cod);
    const correo = correoInput.value.trim();
    const contrasena = contrasenaInput.value.trim();
    const tipo = tipoInput.value.trim().toLowerCase();

    if(!plataforma || !correo || !contrasena){
      salida.textContent = '';
      return;
    }

    const perfilTexto = (tipo === 'c') ? '𝓒𝓸𝓶𝓹𝓵𝓮𝓽𝓪' : perfilSeleccionado;

    const texto = 
`╔══════════🌙 𝓛𝓾𝓷𝓪𝓵𝓲 𝓢𝓽𝓻𝓮𝓪𝓶𝓲𝓷𝓰 🌙══════════╗
    🍒 ${interpretarPlataforma(cod)} • ${obtenerFechaFormateada()} 🍓

📧 𝓒𝓸𝓻𝓻𝓮𝓸:  ${correo}
🔐 𝓒𝓸𝓷𝓽𝓪𝓼𝓮ñ𝓪:  ${contrasena}
👤 𝓟𝓮𝓻𝓯𝓲𝓵:  ${perfilTexto}

╠════════════════🍓 𝓡𝓮𝓰𝓵𝓪𝓼 𝓭𝓮 𝓖𝓪𝓻𝓪𝓷𝓽í𝓪 🍒═════════════════╣
⏳ *CONFIRMA TU ACCESO EN 40 MINUTOS, DESPUÉS DE ESTE TIEMPO ENTRARÁ A REPORTE🚨*
🌸 𝟤𝟧 DÍAS DE GARANTÍA DESDE EL ACCESO
💖 NO CAMBIAR CONTRASEÑA O CORREO NI DATOS DEL PERFIL SIN PERMISO
${reglasDispositivos(tipo)}
> 🍒 𝓡𝓮𝓹𝓸𝓻𝓽𝓮𝓼: https://forms.gle/Y7sHyL7Gouchfwuc8
╚══════════🍓 𝓖𝓻𝓪𝓬𝓲𝓪𝓼 𝓹𝓸𝓻 𝓽𝓾 𝓬𝓸𝓶𝓹𝓻𝓪 🍓══════════╝`;

    salida.textContent = texto;
  }

    if(!plataforma || !correo || !contrasena){
      salida.textContent = '';
      return;
    }

    const perfilTexto = (tipo === 'c') ? '𝓒𝓸𝓶𝓹𝓵𝓮𝓽𝓪' : perfilSeleccionado;

    const texto = 
`╔══════════🌙 𝓛𝓾𝓷𝓪𝓵𝓲 𝓢𝓽𝓻𝓮𝓪𝓶𝓲𝓷𝓰 🌙══════════╗
    🍒 ${plataforma} • ${obtenerFechaFormateada()} 🍓

📧 𝓒𝓸𝓻𝓻𝓮𝓸:  ${correo}
🔐 𝓒𝓸𝓷𝓽𝓻𝓪𝓼𝓮ñ𝓪:  ${contrasena}
👤 𝓟𝓮𝓻𝓯𝓲𝓵:  ${perfilTexto}

╠════════════════🍓 𝓡𝓮𝓰𝓵𝓪𝓼 𝓭𝓮 𝓖𝓪𝓻𝓪𝓷𝓽í𝓪 🍒═════════════════╣
⏳ *CONFIRMA TU ACCESO EN 40 MINUTOS, DESPUÉS DE ESTE TIEMPO ENTRARÁ A REPORTE🚨*
🌸 𝟤𝟧 DÍAS DE GARANTÍA DESDE EL ACCESO
💖 NO CAMBIAR CONTRASEÑA O CORREO NI DATOS DEL PERFIL SIN PERMISO
${reglasDispositivos(tipo)}
> 🍒 𝓡𝓮𝓹𝓸𝓻𝓽𝓮𝓼: https://forms.gle/Y7sHyL7Gouchfwuc8
╚══════════🍓 𝓖𝓻𝓪𝓬𝓲𝓪𝓼 𝓹𝓸𝓻 𝓽𝓾 𝓬𝓸𝓶𝓹𝓻𝓪 🍓══════════╝`;

    salida.textContent = texto;
  }

  [plataformaInput, correoInput, contrasenaInput, tipoInput].forEach(input => {
    input.addEventListener('input', () => {
      definirCantidadPerfiles();
      const esCompleta = tipoInput.value.trim().toLowerCase() === 'c';
      if(esCompleta){
        // si es completa, desactivar estado activo en botones pero mantener visibles (excepto Spotify)
        perfilBtns.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
      } else {
        if(!document.querySelector('#perfilBtns button.active')){
          perfilSeleccionado = 'P1';
          perfilBtns.querySelector('button')?.classList.add('active');
        }
      }
      actualizarSalida();
    });
  });

  copiarBtn.addEventListener('click', () => {
    if(salida.textContent.trim().length === 0) return;
    navigator.clipboard.writeText(salida.textContent).then(() => {
      const original = copiarBtn.textContent;
      copiarBtn.textContent = "✅ Copiado!";
      setTimeout(() => copiarBtn.textContent = original, 1800);
    });
  });

  // Inicialización
  crearBotonesPerfil(5);
  setPerfilesVisible(true);
  actualizarSalida();
</script>
</body>
</html>
